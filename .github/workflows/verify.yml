name: Verify engineering checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Publish dataset quality summary
        if: ${{ !cancelled() }}
        run: |
          cat reports/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat reports/candidate-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ !cancelled() }}
        with:
          name: fixture-evaluation
          path: |
            reports/evaluation.json
            reports/quality-summary.md
            reports/candidate-audit.json
            reports/candidate-audit.md
          if-no-files-found: error
          retention-days: 7
